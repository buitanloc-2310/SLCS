<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Tham gia lớp học · Sky First</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#eaf7ff;color:#10324a;display:grid;min-height:100vh;place-items:center}.c{max-width:560px;margin:24px;padding:28px;border-radius:24px;background:#fff;box-shadow:0 20px 60px #5b8da633}.b{display:inline-block;margin-top:12px;padding:12px 18px;border-radius:14px;background:#1677b8;color:#fff;text-decoration:none;font-weight:700}</style></head><body><main class="c"><h1>Đang mở phòng học…</h1><p id="m">Sky First đang chuyển bạn tới trang tham gia an toàn.</p><a class="b" id="open" href="/">Mở Trung tâm Học tập số</a></main><script>const p=new URLSearchParams(location.search),id=p.get('class');const safe=id&&/^[A-Za-z0-9_-]{1,160}$/.test(id);const target=safe?`/#guest-live/${encodeURIComponent(id)}`:'/';document.getElementById('open').href=target;if(safe){location.replace(target)}else{document.getElementById('m').textContent='Liên kết tham gia không hợp lệ.'}</script></body></html>
